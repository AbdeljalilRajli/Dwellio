<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B15" />
      <stop offset="50%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#12100E" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE1" />
      <stop offset="35%" stop-color="#D4B499" />
      <stop offset="70%" stop-color="#A27B5C" />
      <stop offset="100%" stop-color="#7C5C44" />
    </linearGradient>

    <!-- Accent Bronze Gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5C44" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Architectural Roof Peak / Diamond Accent -->
  <path d="M256 92 L290 126 L256 160 L222 126 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Monogram N with Architectural Styling -->
  <g filter="url(#subtleGlow)">
    <!-- Left Column -->
    <path d="M142 168 L192 168 L192 376 L142 376 Z" fill="url(#goldGrad)" />
    
    <!-- Right Column -->
    <path d="M320 168 L370 168 L370 376 L320 376 Z" fill="url(#goldGrad)" />

    <!-- Diagonal Beam -->
    <path d="M182 168 L244 168 L370 338 L370 376 L308 376 L182 206 Z" fill="url(#bronzeGrad)" />
  </g>

  <!-- Luxury Underline Bar -->
  <rect x="176" y="404" width="160" height="8" rx="4" fill="url(#goldGrad)" opacity="0.8" />
</svg>
